<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="spectreasy-favicon" rel="icon" type="image/svg+xml" href="/OpenPanel/favicon-light.svg" />
    <link rel="preload" as="image" type="image/svg+xml" href="/OpenPanel/favicon-light.svg" />
    <link rel="preload" as="image" type="image/svg+xml" href="/OpenPanel/favicon-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17201d" />
    <meta name="description" content="Private, browser-native spectral flow cytometry panel design." />
    <title>OpenPanel · Spectral Panel Builder</title>
    <script type="module" crossorigin src="/OpenPanel/assets/index-eILpDn3L.js"></script>
    <link rel="stylesheet" crossorigin href="/OpenPanel/assets/index-BB2cgwbP.css">
  <link rel="manifest" href="/OpenPanel/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const favicon = document.getElementById('spectreasy-favicon')
        const faviconBase = new URL('.', favicon.href)
        const preferredDark = window.matchMedia('(prefers-color-scheme: dark)')
        const updateFavicon = () => {
          let storedTheme = ''
          try {
            storedTheme = localStorage.getItem('spectreasy-theme') || localStorage.getItem('spectreasy_theme') || ''
          } catch {
            // The favicon can follow the rendered theme when browser storage is restricted.
          }
          const renderedDark = document.body.classList.contains('dark') || document.documentElement.dataset.theme === 'dark'
          const dark = renderedDark || (storedTheme ? storedTheme === 'dark' : preferredDark.matches)
          favicon.href = new URL(dark ? 'favicon-dark.svg' : 'favicon-light.svg', faviconBase).href
        }
        window.addEventListener('DOMContentLoaded', () => {
          updateFavicon()
          const observer = new MutationObserver(updateFavicon)
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] })
          observer.observe(document.body, { attributes: true, attributeFilter: ['class'] })
        })
        preferredDark.addEventListener('change', updateFavicon)
        window.addEventListener('storage', updateFavicon)
      })()
    </script>
  </body>
</html>
