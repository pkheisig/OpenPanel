name: Build OpenPanel application module release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and module
        run: npm run lint && npm test && npm run build && npm run build:module && npm run test:module

      - name: Upload verified module artifact
        uses: actions/upload-artifact@v4
        with:
          name: openpanel-module-${{ github.ref_name }}
          path: dist-module
          if-no-files-found: error
