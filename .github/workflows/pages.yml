name: Test and build every push; deploy GitHub Pages from main

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpanel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit and parity tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Run browser workflows
        run: npm run test:e2e

      - name: Upload production site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt_1.outputs.page_url || steps.deployment_attempt_2.outputs.page_url || steps.deployment_attempt_3.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages (attempt 1)
        id: deployment_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages caps each polling attempt at 10 minutes. Retry the
          # whole deployment below when Pages remains queued beyond that cap.
          timeout: 600000

      - name: Deploy GitHub Pages (attempt 2)
        id: deployment_attempt_2
        if: steps.deployment_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      - name: Deploy GitHub Pages (attempt 3)
        id: deployment_attempt_3
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      - name: Fail if GitHub Pages deployment failed
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure' && steps.deployment_attempt_3.outcome == 'failure'
        run: exit 1
