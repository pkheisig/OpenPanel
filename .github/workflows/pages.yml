name: Test and build every push; deploy GitHub Pages from main2

on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpanel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit and parity tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Run browser workflows
        run: npm run test:e2e

      - name: Upload production site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main2'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://pkheisig.github.io/OpenPanel/

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download production site
        uses: actions/download-artifact@v5
        with:
          name: site
          path: site

      - name: Publish the Pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R site/. .
          rm -rf site
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push --force origin HEAD:gh-pages
